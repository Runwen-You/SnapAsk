name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test, and publish
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'v0.3.0' || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: "${{ github.workspace }}/.deps"
          cache: true

      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release
        run: cmake --preset msvc-release -DSNAPASK_WARNINGS_AS_ERRORS=ON

      - name: Build Release
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --preset release --output-on-failure

      - name: Create portable ZIP
        shell: pwsh
        run: |
          .\scripts\package-portable.ps1 `
            -BuildDirectory .\out\build\msvc-release

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapAsk-${{ env.RELEASE_TAG }}-win-x64
          path: |
            out/portable/*.zip
            out/portable/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(
            Get-ChildItem -LiteralPath .\out\portable -File |
              Where-Object {
                $_.Extension -eq ".zip" -or $_.Name.EndsWith(".sha256")
              }
          )
          if ($releaseAssets.Count -ne 2) {
            throw "Expected one ZIP and one SHA-256 file, found $($releaseAssets.Count)."
          }

          $releaseTag = $env:RELEASE_TAG
          $version = $releaseTag -replace "^v", ""
          $assetPaths = $releaseAssets | ForEach-Object { $_.FullName }
          gh release create $releaseTag $assetPaths `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "SnapAsk $version" `
            --generate-notes
